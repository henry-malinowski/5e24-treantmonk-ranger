      description:
        value: >-
          <p>@Embed[Compendium.dnd-players-handbook.content.JournalEntry.phbCh3ArtHandout.JournalEntryPage.ckJhsBIlf7Qxo19z
          caption=false classes="three right"]</p><blockquote><p>Wield Fey Mirth
          and Fury</p></blockquote><p>A fey mystique surrounds you, thanks to
          the boon of an archfey or a location in the Feywild that transformed
          you. However you gained fey magic, you are now a
          @UUID[Compendium.5e24-treantmonk-ranger.classes.Item.ttrgrFeyWander00]{Fey
          Wanderer}. Your joyful laughter brightens the hearts of the
          downtrodden, and your martial prowess strikes terror in your foes, for
          great is the mirth of the fey and dreadful is their fury.</p>

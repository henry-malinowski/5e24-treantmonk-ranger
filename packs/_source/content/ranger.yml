  - sort: 100000
    name: Ranger
    type: class
    _id: NDAydqiArY6jLjJM
    system:
      item: Compendium.5e24-treantmonk-ranger.classes.Item.ttrgrRanger00000
      description:
        value: >-
          <p>@Embed[Compendium.dnd-players-handbook.content.JournalEntry.phbCh3ArtHandout.JournalEntryPage.7qN4IGLvwpc7j7KP
          caption=false]</p><p>@Embed[Compendium.dnd-players-handbook.content.JournalEntry.phbCh3ArtHandout.JournalEntryPage.r9NYYGWNoSxEYTlU
          caption=false classes="right two"]</p><p>Far from bustling cities,
          amid the trees of trackless forests and across wide plains,
          @UUID[Compendium.5e24-treantmonk-ranger.classes.Item.ttrgrRanger00000]{Rangers}
          keep their unending watch in the wilderness. Rangers learn to track
          their quarry as a predator does, moving stealthily through the wilds
          and hiding themselves in brush and rubble.</p><p>Thanks to their
          connection with nature, Rangers can also cast spells that harness
          primal powers of the wilderness. A Ranger’s talents and magic are
          honed with deadly focus to protect the world from the ravages of
          monsters and tyrants.</p><h2>Becoming a Ranger …</h2><h3>As a Level 1
          Character</h3><ul><li><p>Gain all the traits in the Core Ranger Traits
          table.</p></li><li><p>Gain the Ranger’s level 1 features, which are
          listed in the Ranger Features table.</p></li></ul><h3>As a Multiclass
          Character</h3><ul><li><p>Gain the following traits from the Core
          Ranger Traits table: Hit Point Die, proficiency with Martial weapons,
          proficiency in one skill of your choice from the Ranger’s skill list,
          and training with Light and Medium armor and
          Shields.</p></li><li><p>Gain the Ranger’s level 1 features, which are
          listed in the Ranger Features table. See the multiclassing rules in
          chapter 2 to determine your available spell slots.</p></li></ul>
        additionalHitPoints: ''
        additionalTraits: ''
        additionalEquipment: ''
        subclass: >-
          <p>A Ranger subclass is a specialization that grants you features at
          certain levels, as specified in the subclass. The next pages present
          the Beast Master, Fey Wanderer, Gloom Stalker, and Hunter
          subclasses.</p>

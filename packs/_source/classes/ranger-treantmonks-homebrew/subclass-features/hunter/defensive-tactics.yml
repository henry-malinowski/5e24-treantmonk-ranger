  description:
    value: >-
      <p>You gain the following features.</p><p><strong>Escape the
      Horde.</strong> When you take the Attack action, you may also take the
      &amp;Reference[Disengage] action as part of the same
      action.</p><p><strong>Multiattack Defense.</strong> When a creature hits
      you with an attack roll, that creature has Disadvantage on all other
      attack rolls against you this turn.</p><p><strong>Resilience.</strong>
      When you fail a Saving Throw, you may use your Reaction to reroll.</p>

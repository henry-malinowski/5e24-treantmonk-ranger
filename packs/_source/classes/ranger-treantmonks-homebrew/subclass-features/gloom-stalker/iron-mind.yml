system:
  description:
    value: >-
      <p>You have honed your ability to resist mind-altering powers. You gain
      proficiency in Wisdom saving throws. If you already have this proficiency,
      you instead gain proficiency in Intelligence or Charisma saving throws
      (your choice).</p><p>Whenever you make a Saving Throw for Intelligence,
      Wisdom or Charisma and are &amp;Reference[invisible apply=false] as a
      result of the Hide Action, you gain a bonus to the roll equal to your
      Wisdom modifier (<strong>currently:</strong> [[lookup
      @abilities.wis.mod]]).</p><section class="secret"
      id="secret-5dqxmon9VZi1vCwf"><p><strong>Foundry Note</strong></p><p>When
      you gain this feature during advancement you will be prompted to choose
      your Saving Throw. You should select Wisdom unless you are already
      proficient in it.</p></section>

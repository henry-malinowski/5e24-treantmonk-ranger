img: icons/magic/unholy/silhouette-robe-evil-power.webp
system:
  description:
    value: >-
      <p>You gain Darkvision with a range of 60 feet. If you already have
      Darkvision when you gain this feature, its range increases by 60
      feet.</p><p>You may take the &amp;Reference[Hide] action as a Bonus
      Action, and may take this action if Heavily Obscured by Darkness even if
      you can be seen as a result of Darkvision or Truesight.</p><p>When you
      have the Invisible Condition as a result of the Hide action, you cannot be
      seen by a creature with Truesight.</p><section class="secret"
      id="secret-EavrzDSgyIsjHyEj"><p><strong>Foundry Note</strong></p><p>This
      feature includes an Active Effect which will automatically increase your
      Darkvision range.</p></section>

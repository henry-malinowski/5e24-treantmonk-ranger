name: Dread Ambusher
type: feat
folder: HQqTHeiSLTtEV8Y6
img: icons/magic/nature/stealth-hide-eyes-pink.webp
system:
  description:
    value: >-
      <p>You have mastered the art of creating fearsome ambushes, granting you
      the following benefits.</p><p><strong>Ambusher’s Leap.</strong> At the
      start of your first turn of each combat, your Speed increases by 10 feet
      until the end of that turn.</p><p><strong>Dreadful Strike.</strong> When
      you attack a creature and hit it with a weapon, you can deal an extra 2d6
      Psychic damage. You can use this benefit only once per turn, you can use
      it a number of times equal to your Wisdom modifier (minimum of once), and
      you regain all expended uses when you finish a Long
      Rest.</p><p><strong>Initiative Bonus.</strong> When you roll Initiative,
      you can add your Wisdom modifier to the roll.</p><section class="secret"
      id="secret-QF11lzzOLRLzoSrk"><p><strong>Foundry Note</strong></p><p>This
      feature includes an Active Effect which automatically adds your Wisdom
      modifier to your Initiative roll.</p><p>The <strong>Ambusher's
      Leap</strong> activity includes an Active Effect that can be used to
      increase your Speed by 10 feet.</p></section>

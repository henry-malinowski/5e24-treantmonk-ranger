name: Stalker's Flurry
type: feat
folder: HQqTHeiSLTtEV8Y6
img: icons/magic/unholy/hand-weapon-glow-black-green.webp
system:
  description:
    value: >-
      <p>Whenever you are Invisible as a result of the Hide Action, and you make
      a Dreadful Strike, it does not count against your number of uses per Long
      Rest. In addition, when you use the Dreadful Strike effect of your Dread
      Ambusher feature, you can cause one of the following additional
      effects.</p><p><strong>Sudden Strike.</strong> You can make another attack
      with the same weapon against a different creature that is within 5 feet of
      the original target and that is within the weapon’s
      range.</p><p><strong>Mass Fear.</strong> The target and each creature
      within 30 feet of it must make a Wisdom saving throw against your spell
      save DC. On a failed save, a creature has the &amp;Reference[Frightened]
      condition until the start of your next turn.</p><p>If you are Invisible as
      a result of the Hide Action when you hit a creature with a Dreadful
      Strike, you may apply both <strong>Sudden Strike</strong> and <strong>Mass
      Fear</strong> to the same attack.</p><section class="secret"
      id="secret-1EO1czD31TZtrQzN"><p><strong>Foundry
      Note</strong></p><p>Dreadful Strike has a new option to use Stalker's
      Flurry.</p><p>To use the <strong>Sudden Strike</strong> effect simply make
      another attack.</p><p>The <strong>Mass Fear</strong> activity on this
      feature includes the save.</p></section>

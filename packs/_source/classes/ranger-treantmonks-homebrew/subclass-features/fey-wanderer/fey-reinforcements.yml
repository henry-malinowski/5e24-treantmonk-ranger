system:
  description:
    value: >-
      <p>You can cast
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplSummonFey0]{Summon
      Fey} as a Bonus Action without a Material component. You can also cast it
      once without a spell slot, and you regain the ability to cast it in this
      way when you finish a Long Rest.</p><p>Whenever you start casting the
      spell, you can modify it so that it doesn’t require Concentration. If you
      do so, the spell’s duration becomes 1 minute for that
      casting.</p><p>Whenever you cast Summon Fey, the creature summoned is
      treated as if cast with a spell slot two levels higher.</p><section
      class="secret" id="secret-gJ5tzqkKp2ML92a3"><p><strong>Foundry
      Note</strong></p><p>This feature can be used for tracking the free use.
      Then cast the spell and uncheck the "Consumption" box and optionally the
      "Concentration" option.</p></section>

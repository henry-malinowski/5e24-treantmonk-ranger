img: icons/magic/defensive/shield-barrier-blades-teal.webp
system:
  description:
    value: >-
      <p>The magic of the Feywild guards your mind. You have Advantage on saving
      throws to avoid or end the Charmed or Frightened condition. If you end
      your turn with the Charmed or Frightened condition, you may end that
      condition (no action required).</p><p>In addition, whenever you hit a
      creature with an attack roll, you can take a Reaction to force a different
      creature you can see within 120 feet of yourself to make a Wisdom save
      against your spell save DC. On a failed save, the target is
      &amp;Reference[Charmed] or &amp;Reference[Frightened] (your choice) for 1
      minute. The target repeats the save at the end of each of its turns,
      ending the effect on itself on a success.</p>

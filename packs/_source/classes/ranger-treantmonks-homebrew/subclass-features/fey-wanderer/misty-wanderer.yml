img: icons/magic/movement/portal-vortex-orange.webp
system:
  description:
    value: >-
      <p>You can cast
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplMistyStep0]{Misty
      Step} without expending a spell slot. You can do so a number of times
      equal to your Wisdom modifier (minimum of once), and you regain all
      expended uses when you finish a Long Rest.</p><p>In addition, whenever you
      cast <em>Misty Step</em>, you can bring along one willing creature you can
      see within 15 feet of yourself. That creature teleports to an unoccupied
      space of your choice within 15 feet of your destination space.</p><section
      class="secret" id="secret-ZBwLFJ6wcrANu0xZ"><p><strong>Foundry
      Note</strong></p><p>This feature can be used for tracking your limited
      uses. Then you can cast the spell normally and uncheck the "Consumption"
      box.</p></section>

name: Dreadful Strikes
type: feat
folder: T745jMPShn5jwq4M
img: icons/skills/melee/strike-axe-energy-pink.webp
system:
  description:
    value: >-
      <p>You can augment your weapon strikes with mind-scarring magic drawn from
      the murky hollows of the Feywild. When you hit a creature with a weapon,
      you can deal an extra 1d4 Psychic damage to the target, which can take
      this extra damage only once per turn. The extra damage increases to 1d6
      when you reach Ranger level 11.</p><p>Alternatively, you can choose for
      the creature to have a penalty equal to the extra damage you would have
      done on the next saving throw it makes that is Intelligence, Wisdom or
      Charisma before the end of your next turn. You make the decision to use
      Dreadful Strikes this way after you roll the damage die but before the
      damage is applied.</p><section class="secret"
      id="secret-4bJV0nAffRomytFv"><p><strong>Foundry Note</strong></p><p>The
      <strong>Damage</strong> activity includes the extra damage or save
      penalty. It automatically scales as you level up.</p></section>

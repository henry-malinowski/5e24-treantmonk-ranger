  description:
    value: >-
      <p>When you summon your Beast of the Land or Beast of the Sea, you can
      choose to make it a Primal Steed. When you do so, its size is one size
      category larger than yours and has the anatomy to serve as a mount for
      you. While mounted on your Primal Steed you cannot be dismounted against
      your will. When you reach level 11, you may summon your Beast of the Sky
      as a Primal Steed as well.</p><section class="secret"
      id="secret-dFb0uteASfxCBh4m"><p><strong>Foundry Note</strong></p><p>Your
      <strong>Primal Companion</strong> feature has improved to include this
      feature.</p></section>

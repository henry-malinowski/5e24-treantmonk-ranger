system:
  description:
    value: >-
      <p>When you command your Primal Companion beast to take the Beast’s Strike
      action, the beast can use it twice, and the damage of each Beast Strike
      attack improves by +2.</p><p>In addition, if the Primal Companion needs to
      make a Saving Throw, it can use your bonus instead of its own if it’s
      higher.</p><section class="secret"
      id="secret-HrciG8o5WNxBJJiD"><p><strong>Foundry Note</strong></p><p>Your
      <strong>Primal Companion</strong> feature has improved to include this
      feature's damage increases. You will need to manually choose which saving
      throw bonuses to use when you Companion is forced to make a saving
      throw.</p></section>

name: Primal Companion
type: feat
folder: h2T2nwR2EGvdb6aT
img: icons/creatures/mammals/wolf-howl-moon-forest-blue.webp
system:
  description:
    value: >-
      <p>You magically summon a primal beast, which draws strength from your
      bond with nature. Choose its stat block:
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbBeastoftheLan]{Beast
      of the Land},
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbBeastoftheSea]{Beast
      of the Sea}, or
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbBeastoftheSky]{Beast
      of the Sky}. You also determine the kind of animal it is, choosing a kind
      appropriate for the stat block. Whatever beast you choose, it bears primal
      markings indicating its supernatural origin.</p><p>The beast is Friendly
      to you and your allies and obeys your commands. It vanishes if you
      die.</p><p><strong>The Beast in Combat.</strong> In combat, the beast acts
      during your turn. It can move and use its Reaction on its own, but the
      only action it takes is the Dodge action unless you take a Bonus Action to
      command it to take an action in its stat block or some other action. You
      can also sacrifice one of your attacks when you take the Attack action to
      command the beast to take the Beast’s Strike action. If you have the
      Incapacitated condition, the beast acts on its own and isn’t limited to
      the Dodge action.</p><p><strong>Restoring or Replacing the Beast.</strong>
      If the beast has died within the last hour, you can take a Magic action to
      touch it and expend a spell slot. The beast returns to life after 1 minute
      with all its Hit Points restored.</p><p>Whenever you finish a Long Rest,
      you can summon a different primal beast, which appears in an unoccupied
      space within 5 feet of you. You choose its stat block and appearance. If
      you already have a beast from this feature, the old one vanishes when the
      new one appears.</p><section class="fvtt advice"
      style="margin:0.5rem;padding:0.5rem"><article><p>In addition to the noted
      usage of your statistics in the companion's Traits and Actions, the
      following attributes are also
      affected.</p><table><caption>Common</caption><tbody><tr><td><strong>AC</strong></td><td>13
      plus your Wisdom
      modifier</td></tr><tr><td><strong>PB</strong></td><td>equals your
      Proficiency Bonus</td></tr></tbody></table><table><caption>Beast of the
      Land</caption><tbody><tr><td><strong>HP</strong></td><td>5 plus five times
      your Ranger level</td></tr><tr><td><strong>HD</strong></td><td>[d8s] equal
      to your Ranger level</td></tr><tr><td><strong>Speed</strong></td><td>40
      ft., Climb 40
      ft.</td></tr><tr><td><strong>Senses</strong></td><td>Darkvision 60
      ft.</td></tr></tbody></table><table><caption>Beast of the
      Sky</caption><tbody><tr><td><strong>HP</strong></td><td>4 plus four times
      your Ranger level</td></tr><tr><td><strong>HD</strong></td><td>[d6s] equal
      to your Ranger level</td></tr><tr><td><strong>Speed</strong></td><td>10
      ft., Fly 60
      ft.</td></tr><tr><td><strong>Senses</strong></td><td>Darkvision 60
      ft.</td></tr></tbody></table><table><caption>Beast of the
      Sea</caption><tbody><tr><td><strong>HP</strong></td><td>5 plus five times
      your Ranger level</td></tr><tr><td><strong>HD</strong></td><td>[d8s] equal
      to your Ranger level</td></tr><tr><td><strong>Speed</strong></td><td>5
      ft., Swim 60
      ft.</td></tr><tr><td><strong>Senses</strong></td><td>Darkvision 90
      ft.</td></tr></tbody></table></article></section><section class="secret"
      id="secret-vZalmDSCpVh4yzu3"><p><strong>Foundry Note</strong></p><p>The
      <strong>Restore Companion</strong> activity will allow you to fully heal
      the beast at the cost of any spell slot.</p><p>The
      <strong>Command</strong> activity only needs to be used if you're tracking
      your Bonus Action usage.</p><p>At higher Ranger levels, this feature is
      automatically upgrade to account for later Beast Master
      features.</p></section>

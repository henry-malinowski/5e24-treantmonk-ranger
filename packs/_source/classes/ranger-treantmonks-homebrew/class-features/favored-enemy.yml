      Strike}</p></td><td><p>1st</p></td></tr><tr><td><p>@UUID[Compendium.5e24-treantmonk-ranger.spells.Item.ttsplHailofThorn]{Hail
      of
      Thorns}</p></td><td><p>1st</p></td></tr><tr><td><p>@UUID[Compendium.5e24-treantmonk-ranger.spells.Item.ttsplHuntersMark]{Hunter’s

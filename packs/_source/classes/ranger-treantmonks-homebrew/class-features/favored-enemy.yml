system:
  description:
    value: >-
      <p>Choose any two spells from the list below that you could select as
      prepared Ranger spells. Those spells are always prepared for you. When you
      use a spell slot to cast any of the chosen spells, you may immediately
      recover the spell slot (no action required) by expending a number of uses
      of this ability equal to the spell slot level.</p><p>You begin with two
      uses of this ability and the uses increase when you reach certain levels
      as shown on the Ranger class chart. You recover any expended uses of this
      ability and may change your selected spells when you complete a Long
      Rest.</p><section class="fvtt advice"
      style="margin:0.5rem;padding:0.5rem"><table

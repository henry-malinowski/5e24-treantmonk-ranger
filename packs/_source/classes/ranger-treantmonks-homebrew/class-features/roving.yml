system:
  description:
    value: >-
      <p>Your Speed increases by 10 feet while you aren’t wearing Heavy armor.
      You also have a Climb Speed and a Swim Speed equal to your Speed. You have
      Advantage on the roll whenever you make a Strength (Athletics) check to
      Climb or Swim.</p><p>You, and creatures of your choice traveling with you,
      do not suffer penalties for traveling at a Normal or Fast
      pace.</p><section class="secret"

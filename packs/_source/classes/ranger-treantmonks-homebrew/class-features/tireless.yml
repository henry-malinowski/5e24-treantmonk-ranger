name: Tireless
type: feat
folder: h5OUzaJcZzsNsOGc
img: icons/magic/life/cross-worn-green.webp
system:
  description:
    value: >-
      <p>Primal forces now help fuel you on your journeys, granting you the
      following benefits.</p><p><strong>Temporary Hit Points.</strong> As a
      Magic action, you can give yourself a number of Temporary Hit Points equal
      to 1d8 plus your Wisdom modifier (minimum of 1). You can use this action a
      number of times equal to your Wisdom modifier (minimum of once), and you
      regain all expended uses when you finish a Long
      Rest.</p><p><strong>Decrease Exhaustion.</strong> Whenever you finish a
      Short Rest, your Exhaustion level, if any, decreases by
      1.</p><p><strong>Endurance.</strong> Whenever you would gain Exhaustion,
      you may reduce the Exhaustion gained by 1 by expending one use of your
      @UUID[Compendium.5e24-treantmonk-ranger.classes.Item.ttrgrFavoredEnem]{Favored
      Enemy} ability. Your D20 Tests are reduced by 1 times your Exhaustion
      level (instead of 2 times). Your Exhaustion level is halved (rounded down)
      when determining the amount your Speed is reduced.</p><section
      class="secret" id="secret-wlhwV2MDwGKQ8plw"><p><strong>Foundry
      Note</strong></p><p>The <strong>Temporary Hit Points</strong> activity can
      apply the Temporary Hit Points to you.</p><p>The <strong>Decrease
      Exhaustion</strong> activity will decrease your
      Exhaustion.</p><p>Endurance includes an Active Effect which cancels out
      the effect of exhaustion as described in this feature.</p></section>

    value: >-
      <p>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplHuntersMar]{Hunter’s
      Mark} is a d10 rather than a d6.</p><p>When you hit with an attack roll,
      you may turn the hit into a Critical Hit. You may turn a hit into a
      Critical Hit a number of times equal to your Wisdom modifier (minimum of
      once), and you regain all expended uses when you finish a Long
      Rest.</p><section class="secret"
      id="secret-GUET2urq4zcuitcV"><p><strong>Foundry Note</strong></p><p>You
      may use this feature in place of the <strong>Bonus Mark Damage</strong>
      activity on the <em>Hunter's Mark</em> spell.</p></section>

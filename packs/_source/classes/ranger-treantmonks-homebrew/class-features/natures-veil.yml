_id: ttrgrNaturesVeil
name: Nature's Veil
type: feat
folder: h5OUzaJcZzsNsOGc
img: icons/magic/nature/leaf-armor-scale-green.webp
system:
  description:
    value: >-
      <p>You invoke spirits of nature to magically hide yourself. As a Bonus
      Action, you can give yourself the Invisible condition until the end of
      your next turn. You may extend your Nature’s Veil for another round by
      taking an action to extend it, in which case it lasts until the end of
      your next turn. You can maintain Nature’s Veil for up to 10
      minutes.</p><p>You can use this feature a number of times equal to your
      Wisdom modifier (minimum of once), and you regain all expended uses when
      you finish a Long Rest.</p><section class="secret"
      id="secret-CrVc4y9VaKTGeCuG"><p><strong>Foundry Note</strong></p><p>This
      feature includes an Active Effect which applies the Invisible condition.
      The extended veil applies the same Active Effect with a 10 minute
      duration.</p></section>

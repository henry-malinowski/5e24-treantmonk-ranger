name: Lightning Arrow
system:
  description:
    value: >-
      <p>As your attack hits or misses the target, the weapon or ammunition
      you’re using transforms into a lightning bolt. <span class="diff-add">The
      target takes 3d8 Lightning damage.</span> <span class="diff-add">Each
      creature within 10 feet of the target takes 1d8 Lightning
      damage.</span></p><p>The weapon or ammunition then returns to its normal
      form.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The damage
      for both effects of the spell increases by 1d8 for each spell slot level
      above 3.</p>

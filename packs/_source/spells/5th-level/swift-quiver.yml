name: Swift Quiver
system:
  description:
    value: >-
      <p>When you cast the spell and as a Bonus Action until it ends, you can
      make two attacks with a weapon that fires Arrows or Bolts, such as a
      Longbow or a Light Crossbow. The spell magically creates the ammunition
      needed for each attack. Each Arrow or Bolt created by the spell deals
      damage like a nonmagical piece of ammunition of its kind and disintegrates
      immediately after it hits or misses.</p><section class="secret"
      id="secret-XYv43C243UyopCSq"><p><strong>Foundry Note</strong></p><p>The
      default <strong>Cast</strong> activity simply consumes a spell slot with
      no other effects.</p><p>The optional <strong>Cast and Enchant</strong>
      activity is configured to also apply an enchantment to a given weapon
      which removes its ammunition consumption.</p></section>

name: Hunter's Mark
system:
  description:
    value: "<p>You magically mark one creature within range as your quarry. Until the spell ends, you deal an extra [[/damage]] damage to the target whenever you hit it with an attack roll. For the duration, you see the target if they have the &amp;Reference[invisible apply=false] condition as if they were visible. You also have Advantage on any [[/check ability=wis skill=sur]] check you make to find it.</p><p>If the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action to move the mark to a new creature you can see within range.</p><p><strong>Using a Higher-Level Spell Slot.</strong>\_If you cast this spell using a level 3+ spell slot, the spell doesn’t require Concentration and the duration becomes 8 hours. If you use a level 5 spell slot, the spell lasts until you complete a &amp;Reference[long rest].</p>"

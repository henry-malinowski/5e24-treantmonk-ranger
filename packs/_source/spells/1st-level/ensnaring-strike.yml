name: Ensnaring Strike
system:
  description:
    value: >-
      <p>The target takes an extra [[/damage 1d6 piercing]] damage from the
      attack as grasping vines appear on it, and it must succeed on a Strength
      saving throw or have the &amp;Reference[restrained apply=false] condition
      until the spell ends. At the end of each of its turns, the Restrained
      target repeats the save, ending the spell on itself on a
      success.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The
      damage increases by 1d6 for each spell slot level above 1.</p>

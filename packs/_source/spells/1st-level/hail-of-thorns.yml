      sprouts from your weapon or ammunition. The target of the attack and each
      creature of your choice within 5 feet of it take 1d6 Piercing
      damage.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The damage
      increases by 1d6 for each spell slot level above 1.</p>

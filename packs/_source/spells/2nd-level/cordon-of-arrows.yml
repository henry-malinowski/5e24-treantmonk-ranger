name: Cordon of Arrows
system:
  description:
    value: >-
      <p>You touch up to four nonmagical Arrows or Bolts and plant them in the
      ground in your space. Until the spell ends, the ammunition can’t be
      physically uprooted, and whenever a creature other than you enters a space
      within 30 feet of the ammunition for the first time on a turn or ends its
      turn there, one piece of ammunition flies up to strike it.</p><p>The
      creature takes [[/damage]] damage. The piece of ammunition is then
      destroyed. The spell ends when none of the ammunition remains planted in
      the ground.</p><p>When you cast this spell, you can designate any
      creatures you choose, and the spell ignores them.</p><p><strong>Using a
      Higher-Level Spell Slot.</strong> The damage increases by 1d8 for each
      spell slot level above 2.</p><section class="secret"
      id="secret-hTdxVas0HdLYLcC5"><p><strong>Foundry Note</strong></p><p>The
      <strong>Cast</strong> activity will reset the limited uses of this item
      according to how many pieces of ammunition are affected and can be fired
      by the <strong>Damage </strong>activity.</p></section>

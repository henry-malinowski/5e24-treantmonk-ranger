      description:
        value: >-
          <p><em>Melee Attack Roll:</em> Bonus equals your spell attack
          modifier, reach 5 ft. <em>Hit:</em> 1d8 + 2 plus your Wisdom modifier
          Bludgeoning, Force, Piercing, or Slashing damage (your choice when you
          summon the beast). If the beast moved at least 20 feet straight toward
          the target before the hit, the target takes an extra 1d6 damage of the
          same type, and the target has the &amp;Reference[prone] condition if
          it is a Large or smaller creature.</p><section class="secret"
          id="secret-fxROphHp3AaFzUXp"><p><strong>Foundry
          Note</strong></p><p>The <strong>Attack</strong> and <strong>Charging
          Attack</strong> activities will allow you to choose the damage type in
          the roll dialog. You should choose one damage type and use it
          consistently until resummoning your companion.</p><p>The
          <strong>Charging Attack</strong> activity includes the additional
          damage.</p></section>
